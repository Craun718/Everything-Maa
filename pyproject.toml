[project]
name = "everything-maa"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0,<10",
    "PyYAML>=6.0,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["skills"]

[tool.coverage.report]
show_missing = true

[tool.uv]
package = false
